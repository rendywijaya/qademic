<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Qademic favicon — 100×100 viewBox
    Same geometry as QMark component, scaled ×3.125 from 32px

    Q: center (50, 43.5), r=25, sw=11.5
    Gap 80° from 15° to 95°

    Arc start (95°):
      x = 50 + 25×cos(95°) = 50 + 25×(−0.0872) = 50 − 2.18 = 47.82
      y = 43.5 + 25×sin(95°) = 43.5 + 25×0.9962  = 43.5 + 24.90 = 68.40

    Arc end (15°):
      x = 50 + 25×cos(15°) = 50 + 25×0.9659  = 50 + 24.15 = 74.15
      y = 43.5 + 25×sin(15°) = 43.5 + 25×0.2588 = 43.5 +  6.47 = 49.97

    Tail at 30° above horizontal, length = 0.21×100 = 21:
      dx = 21×cos(30°) = 21×0.866 = 18.19
      dy = 21×sin(30°) = 21×0.5   = 10.5
      End: (74.15 + 18.19, 49.97 − 10.5) = (92.34, 39.47)

    Border: bw = 5, inset 2.5 each side
  -->

  <!-- Dark base -->
  <rect width="100" height="100" rx="22" fill="#050810"/>

  <!-- Amber border -->
  <rect
    x="2.5" y="2.5"
    width="95" height="95"
    rx="19.5"
    fill="none"
    stroke="#F59E0B"
    stroke-width="5"
    opacity="0.40"
  />

  <!-- Soft glow layer (double-draw, no filter) -->
  <path
    d="M 47.82 68.40 A 25 25 0 1 1 74.15 49.97"
    fill="none"
    stroke="#F59E0B"
    stroke-width="27.6"
    stroke-linecap="round"
    opacity="0.10"
  />
  <line
    x1="74.15" y1="49.97"
    x2="92.34" y2="39.47"
    stroke="#F59E0B"
    stroke-width="27.6"
    stroke-linecap="round"
    opacity="0.10"
  />

  <!-- Q arc — bold amber -->
  <path
    d="M 47.82 68.40 A 25 25 0 1 1 74.15 49.97"
    fill="none"
    stroke="#F59E0B"
    stroke-width="11.5"
    stroke-linecap="round"
  />

  <!-- Rising tail at 30° -->
  <line
    x1="74.15" y1="49.97"
    x2="92.34" y2="39.47"
    stroke="#F59E0B"
    stroke-width="11.5"
    stroke-linecap="round"
  />
</svg>
